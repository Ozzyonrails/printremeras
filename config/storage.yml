# Two logical buckets: "public" (mockups, catalog previews, approved review photos)
# and "private" (customer uploads, print files, pending review photos).
# Models reference them through Rails.configuration.x.storage.{public,private}_service,
# which resolves to local_* (Disk) in dev/test and s3_* (R2 / S3) in production.
#
# During `assets:precompile` the production environment boots without real credentials
# (SECRET_KEY_BASE_DUMMY is set by Rails), so bucket names fall back to a placeholder
# there. Outside that build step a missing bucket still fails loudly.
<% placeholder = ENV["SECRET_KEY_BASE_DUMMY"] ? "build-placeholder" : nil %>
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local_public:
  service: Disk
  root: <%= Rails.root.join("storage/public") %>

local_private:
  service: Disk
  root: <%= Rails.root.join("storage/private") %>

# Cloudflare R2 (recommended) or AWS S3. For R2 set S3_ENDPOINT to
# https://<account_id>.r2.cloudflarestorage.com and S3_REGION=auto. R2 rejects the ACL
# header Active Storage sends for public buckets, so an R2 endpoint selects the R2
# service (lib/active_storage/service/r2_service.rb). Force it with S3_SERVICE.
<% s3_service = ENV.fetch("S3_SERVICE") { ENV["S3_ENDPOINT"].to_s.include?("r2.cloudflarestorage.com") ? "R2" : "S3" } %>
s3_public:
  service: <%= s3_service %>
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("S3_REGION", "auto") %>
  bucket: <%= ENV["S3_PUBLIC_BUCKET"] || placeholder %>
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  force_path_style: <%= ENV.fetch("S3_FORCE_PATH_STYLE", "true") %>
  public: true
  upload:
    cache_control: "public, max-age=31536000, immutable"

s3_private:
  service: <%= s3_service %>
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("S3_REGION", "auto") %>
  bucket: <%= ENV["S3_PRIVATE_BUCKET"] || placeholder %>
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  force_path_style: <%= ENV.fetch("S3_FORCE_PATH_STYLE", "true") %>

test_public:
  service: Disk
  root: <%= Rails.root.join("tmp/storage/public") %>

test_private:
  service: Disk
  root: <%= Rails.root.join("tmp/storage/private") %>
